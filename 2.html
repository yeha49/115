<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>油壓乙級 行動版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbbfd);
            color: white;
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 頂部導航 ===== */
        .home-nav {
            position: fixed;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 5px;
            z-index: 1100;
        }
        .home-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        .home-button:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
        }

        .question-nav {
            position: fixed;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 5px;
            z-index: 1100;
        }
        .nav-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        .nav-button:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
        }
        .question-indicator {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            z-index: 1100;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        /* ===== 主容器 ===== */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* ===== 圖片區域（水平滑動輪播） ===== */
        .images-container {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            background: #1a2632;
            touch-action: pan-y;
        }

        .slide-track {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .slide-track.shift {
            transform: translateX(-50%);
        }

        .slide-item {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a2632;
            position: relative;
            flex-shrink: 0;
        }

        .slide-item .base-image,
        .slide-item .layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .slide-item .base-image {
            z-index: 0;
        }
        .slide-item .layer {
            z-index: 1;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        /* ===== 頁碼指示器 ===== */
        .view-indicator {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            white-space: nowrap;
        }
        .view-indicator .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: background 0.3s ease;
        }
        .view-indicator .dot.active {
            background: #58a6ff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }
        .view-indicator .page-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        /* ===== 底部控制欄 ===== */
        .controls {
            background: rgba(20, 22, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 12px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            width: 100%;
            z-index: 10;
        }

        .main-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex: 1 1 auto;
            min-width: 0;
            max-width: 100%;
        }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .toggle-btn.active {
            background: rgba(76, 175, 80, 0.5);
            border-color: rgba(76, 175, 80, 0.6);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.25);
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .number-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 5px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .number-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .number-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #1a2632;
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .key-hint {
            text-align: center;
            margin-top: 4px;
            font-size: 0.7rem;
            opacity: 0.5;
            letter-spacing: 0.3px;
        }

        /* ===== 浮動導航 (修復: 確保初始可見 + 防止溢出) ===== */
        .floating-nav {
            position: fixed;
            display: flex;
            gap: 6px;
            z-index: 1150;
            /* 提高至所有頂層元素之上，但低於模態層 */;
            top: 80px;
            right: 12px;
            touch-action: none;
            user-select: none;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            /* 防止意外被隱藏 */;
            max-width: 90vw;
            flex-wrap: nowrap;
            transition: none;
        }
        .floating-nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(30, 32, 40, 0.75);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            opacity: 0.85;
            touch-action: manipulation;
            flex-shrink: 0;
            min-width: 42px;
        }
        .floating-nav-btn:hover {
            opacity: 1;
            transform: scale(1.05);
            background: rgba(50, 52, 60, 0.85);
        }
        .floating-nav-btn.floating-toggle-btn {
            width: auto;
            min-width: 42px;
            padding: 0 14px;
            border-radius: 21px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .floating-nav-btn.floating-toggle-btn.active {
            background: rgba(76, 175, 80, 0.55);
            border-color: rgba(76, 175, 80, 0.7);
            box-shadow: 0 0 14px rgba(76, 175, 80, 0.35);
        }
        /* 拖動中增加回饋 */
        .floating-nav.dragging .floating-nav-btn {
            opacity: 0.7;
            transform: scale(0.95);
        }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .question-indicator {
                font-size: 0.8rem;
                padding: 3px 12px;
                top: 10px;
            }
            .home-button,
            .nav-button {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .controls {
                padding: 8px 10px 10px;
            }
            .toggle-btn {
                padding: 5px 10px;
                font-size: 0.7rem;
            }
            .nav-btn {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
            .number-btn {
                min-width: 28px;
                height: 28px;
                font-size: 0.7rem;
                padding: 0 4px;
            }
            .floating-nav {
                top: 70px;
                right: 8px;
                gap: 4px;
            }
            .floating-nav-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
                min-width: 36px;
            }
            .floating-nav-btn.floating-toggle-btn {
                min-width: 36px;
                padding: 0 10px;
                font-size: 0.7rem;
            }
            .view-indicator {
                padding: 4px 14px;
                bottom: 12px;
                gap: 10px;
            }
            .view-indicator .dot {
                width: 6px;
                height: 6px;
            }
            .view-indicator .page-label {
                font-size: 0.7rem;
            }
            .key-hint {
                font-size: 0.6rem;
            }
        }
        @media (max-width: 480px) {
            .question-indicator {
                font-size: 0.7rem;
                padding: 2px 10px;
                top: 8px;
            }
            .home-button,
            .nav-button {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }
            .controls {
                padding: 6px 6px 8px;
            }
            .toggle-btn {
                padding: 4px 8px;
                font-size: 0.65rem;
            }
            .nav-btn {
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
            }
            .number-btn {
                min-width: 24px;
                height: 24px;
                font-size: 0.6rem;
                padding: 0 3px;
                border-radius: 12px;
            }
            .floating-nav {
                top: 58px;
                right: 6px;
                gap: 3px;
            }
            .floating-nav-btn {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
                min-width: 32px;
            }
            .floating-nav-btn.floating-toggle-btn {
                min-width: 32px;
                padding: 0 8px;
                font-size: 0.6rem;
            }
            .view-indicator {
                padding: 3px 12px;
                bottom: 10px;
                gap: 8px;
            }
            .view-indicator .dot {
                width: 5px;
                height: 5px;
            }
            .view-indicator .page-label {
                font-size: 0.65rem;
            }
            .key-hint {
                font-size: 0.55rem;
                margin-top: 2px;
            }
            .buttons-row {
                gap: 3px;
            }
            .main-controls {
                gap: 4px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .controls {
                padding: 4px 8px 6px;
            }
            .toggle-btn {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
            .nav-btn {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
            }
            .number-btn {
                min-width: 22px;
                height: 22px;
                font-size: 0.55rem;
                padding: 0 3px;
            }
            .key-hint {
                display: none;
            }
            .view-indicator {
                bottom: 6px;
                padding: 2px 10px;
                gap: 6px;
            }
            .view-indicator .page-label {
                font-size: 0.6rem;
            }
            .floating-nav {
                top: 50px;
                right: 6px;
                gap: 3px;
            }
            .floating-nav-btn {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
                min-width: 28px;
            }
            .floating-nav-btn.floating-toggle-btn {
                min-width: 28px;
                padding: 0 6px;
                font-size: 0.55rem;
            }
            .question-indicator {
                font-size: 0.6rem;
                padding: 2px 8px;
                top: 6px;
            }
            .home-button,
            .nav-button {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 固定頂部 ===== -->
    <div class="home-nav">
        <a href="https://yeha49.github.io/115" class="home-button" aria-label="首頁">
            <svg width="18" height="16" viewBox="0 0 20 18" fill="none" stroke="white" stroke-width="2">
                <path d="M1 9 L10 1 L19 9 M5 17 L5 9 M15 17 L15 9 M1 17 L19 17"></path>
            </svg>
        </a>
    </div>
    <div class="question-indicator" id="question-indicator">
        第 <span id="current-question">5</span> 題 / 共 <span id="total-questions">8</span> 題
    </div>
    <div class="question-nav">
        <a href="2.html?q=2-4" id="prev-question" class="nav-button">←</a>
        <a href="2.html?q=2-6" id="next-question" class="nav-button">→</a>
    </div>

    <!-- ===== 主內容 ===== -->
    <div class="container">
        <div class="content">

            <!-- 圖片區域：水平滑動 -->
            <div class="images-container" id="images-container">
                <div class="slide-track" id="slide-track">
                    <!-- 第一張：e0.gif -->
                    <div class="slide-item" id="slide-0"></div>
                    <!-- 第二張：0.gif -->
                    <div class="slide-item" id="slide-1"></div>
                </div>

                <!-- 頁碼指示器 -->
                <div class="view-indicator" id="view-indicator">
                    <span class="dot active" id="dot0"></span>
                    <span class="dot" id="dot1"></span>
                    <span class="page-label" id="view-label">1 / 2  e0 圖</span>
                </div>
            </div>

            <!-- ===== 底部控制欄 ===== -->
            <div class="controls">
                <div class="main-controls">
                    <button class="toggle-btn" id="toggle-all">全部顯示</button>
                    <button class="nav-btn" id="prev-layer">←</button>
                    <button class="nav-btn" id="next-layer">→</button>
                    <div class="buttons-row" id="buttons-row">
                        <!-- 圖層數字按鈕由 JS 動態生成 -->
                    </div>
                </div>
                <div class="key-hint">← → 切換圖層 ｜ 空格 顯示/隱藏 ｜ 左右滑動切換 e0 / 0 圖</div>
            </div>
        </div>
    </div>

    <!-- ===== 浮動導航 (修復: 加入 id 以便 JS 控制) ===== -->
    <div class="floating-nav" id="floating-nav">
        <div class="floating-nav-btn floating-toggle-btn" id="floating-toggle">全部顯示</div>
        <div class="floating-nav-btn" id="floating-prev">←</div>
        <div class="floating-nav-btn" id="floating-next">→</div>
    </div>

    <!-- ===== JavaScript ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ----- 1. 題目數據 -----
            const pathTitleList = [
                ['2-1', '1. 電動機正反轉兼Y-Δ啟動', '15'],
                ['2-2', '2. 電動機正反轉兼Y-Δ啟動附瞬時停電保護', '21'],
                ['2-3', '3. 兩台抽水泵手動、自動交替', '17'],
                ['2-4', '4. 污排水泵手動、自動交互兼異常水位並列運轉', '20'],
                ['2-5', '5. 差動、調壓、調速迴路設計、裝配、運轉及調整', '19'],
                ['2-6', '6. 蓄壓、鎖固、降壓迴路設計、裝配運轉及調整', '18'],
                ['2-7', '7. 常用電源與備用電源自動切換', '16'],
                ['2-8', '8. 三相三線負載之瓦時、乏時、功因、電壓、電流監視盤', '11']
            ];

            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q') || '2-5';

            let matchedTitle = '5. 沖床機自動計數直流煞車';
            let question_no = 19;
            let currentQuestionIndex = 4;

            for (let i = 0; i < pathTitleList.length; i++) {
                const [pathKey, title, stack] = pathTitleList[i];
                if (q == pathKey) {
                    matchedTitle = title;
                    question_no = parseInt(stack, 10);
                    currentQuestionIndex = i;
                    break;
                }
            }

            document.title = matchedTitle;
            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            document.getElementById('total-questions').textContent = pathTitleList.length;

            if (currentQuestionIndex >= 0) {
                const prevIdx = currentQuestionIndex === 0 ? pathTitleList.length - 1 : currentQuestionIndex - 1;
                const nextIdx = currentQuestionIndex === pathTitleList.length - 1 ? 0 : currentQuestionIndex + 1;
                document.getElementById('prev-question').href = `2.html?q=${pathTitleList[prevIdx][0]}`;
                document.getElementById('next-question').href = `2.html?q=${pathTitleList[nextIdx][0]}`;
            }

            // ----- 2. 圖層數據 -----
            const layers0 = [];
            const layers1 = [];
            for (let i = 1; i <= question_no; i++) {
                layers0.push({ id: 's0-l' + i, image: 'e' + i + '.gif' });
                layers1.push({ id: 's1-l' + i, image: i + '.gif' });
            }

            // ----- 3. DOM 引用 -----
            const slide0 = document.getElementById('slide-0');
            const slide1 = document.getElementById('slide-1');
            const track = document.getElementById('slide-track');
            const buttonsRow = document.getElementById('buttons-row');
            const toggleAllBtn = document.getElementById('toggle-all');
            const prevLayerBtn = document.getElementById('prev-layer');
            const nextLayerBtn = document.getElementById('next-layer');
            const floatingNav = document.getElementById('floating-nav');
            const floatingToggle = document.getElementById('floating-toggle');
            const floatingPrev = document.getElementById('floating-prev');
            const floatingNext = document.getElementById('floating-next');
            const dot0 = document.getElementById('dot0');
            const dot1 = document.getElementById('dot1');
            const viewLabel = document.getElementById('view-label');

            // ----- 4. 狀態 -----
            let currentSlide = 0;
            let currentLayerIndex = -1;
            let allVisible = false;
            let blinkInterval = null;
            let isBlinking = false;
            let blinkState = false;
            const BLINK_INTERVAL = 600;

            // 拖動
            let isDragging = false;
            let isPotentialDrag = false;
            let dragOffsetX, dragOffsetY;
            let dragStartX, dragStartY;
            let dragTimeout;
            const DRAG_THRESHOLD = 5;
            const DRAG_DELAY = 200;

            // 滑動
            let touchStartX = 0;
            let touchStartY = 0;
            let touchMoved = false;
            const SWIPE_THRESHOLD = 30;

            // ----- 5. 構建幻燈片內容 -----
            function buildSlide(container, slideIndex) {
                container.innerHTML = '';
                const isFirst = (slideIndex === 0);
                const baseSrc = isFirst ? (q + '/e0.gif') : (q + '/0.gif');
                const layers = isFirst ? layers0 : layers1;

                const baseImg = document.createElement('img');
                baseImg.className = 'base-image';
                baseImg.src = baseSrc;
                baseImg.alt = isFirst ? 'e0圖' : '0圖';
                baseImg.draggable = false;
                container.appendChild(baseImg);

                layers.forEach((layer) => {
                    const img = document.createElement('img');
                    img.id = layer.id + '-el';
                    img.className = 'layer';
                    img.src = q + '/' + layer.image;
                    img.alt = layer.id;
                    img.draggable = false;
                    img.style.opacity = '0';
                    container.appendChild(img);
                });
            }

            buildSlide(slide0, 0);
            buildSlide(slide1, 1);

            // ----- 6. 圖層輔助函數 -----
            function getLayerElements(slideIndex, layerIndex) {
                const layers = slideIndex === 0 ? layers0 : layers1;
                if (layerIndex < 0 || layerIndex >= layers.length) return null;
                return document.getElementById(layers[layerIndex].id + '-el');
            }

            function getAllLayerElements(slideIndex) {
                const layers = slideIndex === 0 ? layers0 : layers1;
                const els = [];
                layers.forEach(l => {
                    const el = document.getElementById(l.id + '-el');
                    if (el) els.push(el);
                });
                return els;
            }

            function updateLayerVisibility(slideIndex, layerIndex, visible) {
                const el = getLayerElements(slideIndex, layerIndex);
                if (el) el.style.opacity = visible ? '1' : '0';
            }

            function updateAllLayersVisibility(slideIndex, visible, opacityVal) {
                const els = getAllLayerElements(slideIndex);
                els.forEach(el => el.style.opacity = visible ? (opacityVal || '1') : '0');
            }

            function hideAllLayers(slideIndex) { updateAllLayersVisibility(slideIndex, false); }

            function showAllLayers(slideIndex, opacityVal) { updateAllLayersVisibility(slideIndex, true, opacityVal || '0.5'); }

            function stopBlinking() {
                isBlinking = false;
                if (blinkInterval) { clearInterval(blinkInterval);
                    blinkInterval = null; }
                if (!allVisible && currentLayerIndex >= 0) {
                    const el0 = getLayerElements(0, currentLayerIndex);
                    const el1 = getLayerElements(1, currentLayerIndex);
                    if (el0) el0.style.opacity = '1';
                    if (el1) el1.style.opacity = '1';
                } else if (allVisible) {
                    getAllLayerElements(0).forEach(el => el.style.opacity = '0.5');
                    getAllLayerElements(1).forEach(el => el.style.opacity = '0.5');
                }
            }

            function startBlinking(slideIndex, layerIndex) {
                stopBlinking();
                if (allVisible) return;
                const el = getLayerElements(slideIndex, layerIndex);
                if (!el) return;
                isBlinking = true;
                blinkState = true;
                const other = slideIndex === 0 ? 1 : 0;
                const otherEl = getLayerElements(other, layerIndex);
                if (el) el.style.opacity = '1';
                if (otherEl) otherEl.style.opacity = '1';

                blinkInterval = setInterval(() => {
                    blinkState = !blinkState;
                    const v = blinkState ? '1' : '0.3';
                    const e1 = getLayerElements(slideIndex, layerIndex);
                    const e2 = getLayerElements(other, layerIndex);
                    if (e1) e1.style.opacity = v;
                    if (e2) e2.style.opacity = v;
                }, BLINK_INTERVAL);
            }

            // ----- 7. 圖層選擇與全部顯示 -----
            function selectLayer(layerIndex) {
                if (allVisible) toggleAllLayers();
                stopBlinking();
                hideAllLayers(0);
                hideAllLayers(1);
                if (layerIndex >= 0 && layerIndex < layers0.length) {
                    updateLayerVisibility(0, layerIndex, true);
                    updateLayerVisibility(1, layerIndex, true);
                    currentLayerIndex = layerIndex;
                    startBlinking(currentSlide, layerIndex);
                } else {
                    currentLayerIndex = -1;
                }
                document.querySelectorAll('.number-btn').forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === layerIndex);
                });
            }

            function toggleAllLayers() {
                allVisible = !allVisible;
                stopBlinking();
                if (allVisible) {
                    showAllLayers(0, '0.5');
                    showAllLayers(1, '0.5');
                    currentLayerIndex = layers0.length - 1;
                    document.querySelectorAll('.number-btn').forEach(b => b.classList.add('active'));
                    toggleAllBtn.textContent = '全部隱藏';
                    toggleAllBtn.classList.add('active');
                    floatingToggle.textContent = '全部隱藏';
                    floatingToggle.classList.add('active');
                } else {
                    hideAllLayers(0);
                    hideAllLayers(1);
                    currentLayerIndex = -1;
                    document.querySelectorAll('.number-btn').forEach(b => b.classList.remove('active'));
                    toggleAllBtn.textContent = '全部顯示';
                    toggleAllBtn.classList.remove('active');
                    floatingToggle.textContent = '全部顯示';
                    floatingToggle.classList.remove('active');
                }
            }

            function showNextLayer() {
                if (allVisible) toggleAllLayers();
                const total = layers0.length;
                if (total === 0) return;
                selectLayer((currentLayerIndex + 1) % total);
            }

            function showPrevLayer() {
                if (allVisible) toggleAllLayers();
                const total = layers0.length;
                if (total === 0) return;
                selectLayer((currentLayerIndex - 1 + total) % total);
            }

            // ----- 8. 幻燈片切換 -----
            function switchSlide(slideIndex) {
                if (slideIndex === currentSlide) return;
                currentSlide = slideIndex;
                track.classList.toggle('shift', slideIndex === 1);

                dot0.classList.toggle('active', slideIndex === 0);
                dot1.classList.toggle('active', slideIndex === 1);
                viewLabel.textContent = (slideIndex + 1) + ' / 2  ' + (slideIndex === 0 ? 'e0 圖' : '0 圖');

                if (currentLayerIndex >= 0 && !allVisible) {
                    stopBlinking();
                    updateLayerVisibility(0, currentLayerIndex, true);
                    updateLayerVisibility(1, currentLayerIndex, true);
                    startBlinking(slideIndex, currentLayerIndex);
                } else if (allVisible) {
                    showAllLayers(0, '0.5');
                    showAllLayers(1, '0.5');
                }
            }

            // ----- 9. 生成數字按鈕 -----
            for (let i = 0; i < layers0.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i + 1;
                btn.dataset.index = i;
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index, 10);
                    if (allVisible) toggleAllLayers();
                    if (currentLayerIndex === idx) {
                        stopBlinking();
                        hideAllLayers(0);
                        hideAllLayers(1);
                        currentLayerIndex = -1;
                        document.querySelectorAll('.number-btn').forEach(b => b.classList.remove('active'));
                    } else {
                        selectLayer(idx);
                    }
                });
                buttonsRow.appendChild(btn);
            }

            // ----- 10. 事件綁定 -----
            toggleAllBtn.addEventListener('click', toggleAllLayers);
            floatingToggle.addEventListener('click', function(e) {
                if (!isDragging) toggleAllLayers();
            });
            prevLayerBtn.addEventListener('click', showPrevLayer);
            nextLayerBtn.addEventListener('click', showNextLayer);
            floatingPrev.addEventListener('click', function(e) {
                if (!isDragging) showPrevLayer();
            });
            floatingNext.addEventListener('click', function(e) {
                if (!isDragging) showNextLayer();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight') { showNextLayer();
                    e.preventDefault(); } else if (e.key === 'ArrowLeft') { showPrevLayer();
                    e.preventDefault(); } else if (e.key === ' ') { toggleAllLayers();
                    e.preventDefault(); }
            });

            // ----- 11. 左右滑動切換幻燈片 -----
            const container = document.getElementById('images-container');

            container.addEventListener('touchstart', function(e) {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchMoved = false;
            }, { passive: true });

            container.addEventListener('touchmove', function(e) {
                if (!touchStartX) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 15) {
                    e.preventDefault();
                }
            }, { passive: false });

            container.addEventListener('touchend', function(e) {
                if (!touchStartX || !touchMoved) { touchStartX = 0; return; }
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
                    if (dx < 0) {
                        switchSlide(currentSlide === 0 ? 1 : 0);
                    } else {
                        switchSlide(currentSlide === 1 ? 0 : 1);
                    }
                }
                touchStartX = 0;
                touchMoved = false;
            }, { passive: true });

            // ----- 12. 浮動導航拖動 (修復: 增加邊界保護) -----
            function handleDragStart(e) {
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                if (clientX == null) return;
                dragStartX = clientX;
                dragStartY = clientY;
                isPotentialDrag = true;
                dragTimeout = setTimeout(function() {
                    if (isPotentialDrag) startDragging(clientX, clientY);
                }, DRAG_DELAY);
                document.addEventListener('mousemove', handleDragMove);
                document.addEventListener('mouseup', handleDragEnd);
                document.addEventListener('touchmove', handleDragMove, { passive: false });
                document.addEventListener('touchend', handleDragEnd);
            }

            function handleDragMove(e) {
                if (!isPotentialDrag && !isDragging) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                if (clientX == null) return;
                if (isPotentialDrag && !isDragging) {
                    if (Math.abs(clientX - dragStartX) > DRAG_THRESHOLD || Math.abs(clientY - dragStartY) > DRAG_THRESHOLD) {
                        startDragging(clientX, clientY);
                    }
                }
                if (isDragging) {
                    let x = clientX - dragOffsetX;
                    let y = clientY - dragOffsetY;
                    const maxX = window.innerWidth - floatingNav.offsetWidth - 10;
                    const maxY = window.innerHeight - floatingNav.offsetHeight - 10;
                    x = Math.min(Math.max(10, x), Math.max(10, maxX));
                    y = Math.min(Math.max(10, y), Math.max(10, maxY));
                    floatingNav.style.left = x + 'px';
                    floatingNav.style.top = y + 'px';
                    floatingNav.style.right = 'auto';
                    if (e.touches) e.preventDefault();
                }
            }

            function handleDragEnd() {
                clearTimeout(dragTimeout);
                if (isDragging) {
                    try {
                        localStorage.setItem('floatingNavPos', JSON.stringify({
                            left: floatingNav.style.left,
                            top: floatingNav.style.top
                        }));
                    } catch (e) {}
                }
                isDragging = false;
                isPotentialDrag = false;
                floatingNav.classList.remove('dragging');
                document.removeEventListener('mousemove', handleDragMove);
                document.removeEventListener('mouseup', handleDragEnd);
                document.removeEventListener('touchmove', handleDragMove);
                document.removeEventListener('touchend', handleDragEnd);
            }

            function startDragging(clientX, clientY) {
                isDragging = true;
                isPotentialDrag = false;
                floatingNav.classList.add('dragging');
                const rect = floatingNav.getBoundingClientRect();
                dragOffsetX = clientX - rect.left;
                dragOffsetY = clientY - rect.top;
            }

            [floatingToggle, floatingPrev, floatingNext].forEach(function(btn) {
                btn.addEventListener('mousedown', handleDragStart);
                btn.addEventListener('touchstart', handleDragStart, { passive: true });
            });

            // ----- 13. 修復: 驗證並恢復浮動導航位置 (核心修復) -----
            function restoreFloatingNavPosition() {
                // 確保導航在可視區域內
                const navWidth = floatingNav.offsetWidth || 60;
                const navHeight = floatingNav.offsetHeight || 150;
                const maxX = window.innerWidth - navWidth - 20;
                const maxY = window.innerHeight - navHeight - 20;
                const minX = 10;
                const minY = 10;

                // 先嘗試從 localStorage 讀取
                const savedPos = localStorage.getItem('floatingNavPos');
                let useDefault = true;
                let leftPos = null;
                let topPos = null;

                if (savedPos) {
                    try {
                        const pos = JSON.parse(savedPos);
                        const left = parseFloat(pos.left);
                        const top = parseFloat(pos.top);
                        if (!isNaN(left) && !isNaN(top) && left >= minX && top >= minY && left <= maxX && top <= maxY) {
                            leftPos = left;
                            topPos = top;
                            useDefault = false;
                        }
                    } catch (e) {}
                }

                if (useDefault) {
                    // 使用 CSS 預設值 (右上角)
                    floatingNav.style.right = '12px';
                    floatingNav.style.top = '80px';
                    floatingNav.style.left = 'auto';
                    // 清除無效的 localStorage 記錄
                    try {
                        localStorage.removeItem('floatingNavPos');
                    } catch (e) {}
                } else {
                    floatingNav.style.left = leftPos + 'px';
                    floatingNav.style.top = topPos + 'px';
                    floatingNav.style.right = 'auto';
                }

                // 強制確保 visible
                floatingNav.style.opacity = '1';
                floatingNav.style.visibility = 'visible';
                floatingNav.style.display = 'flex';
            }

            // 初始還原 (在 DOM 準備好後立即執行)
            restoreFloatingNavPosition();

            // 在頁面完全載入後再驗證一次 (防止 layout 變化)
            window.addEventListener('load', function() {
                // 延遲一點確保所有元素都已渲染
                setTimeout(function() {
                    restoreFloatingNavPosition();
                }, 50);
            });

            // 窗口大小變化時重新校準
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    const rect = floatingNav.getBoundingClientRect();
                    const maxX = window.innerWidth - floatingNav.offsetWidth - 20;
                    const maxY = window.innerHeight - floatingNav.offsetHeight - 20;
                    const minX = 10;
                    const minY = 10;
                    // 如果當前位置超出邊界，重置到默認位置
                    if (rect.left < minX || rect.top < minY || rect.right > window.innerWidth - 10 || rect.bottom > window
                        .innerHeight - 10) {
                        restoreFloatingNavPosition();
                    }
                }, 200);
            });

            // ----- 14. 初始化幻燈片狀態 -----
            currentSlide = 0;
            track.classList.remove('shift');
            dot0.classList.add('active');
            dot1.classList.remove('active');
            viewLabel.textContent = '1 / 2  e0 圖';

            console.log('✅ 行動版已載入 | 題號:', q, ' 圖層數:', question_no);
            console.log('💡 左右滑動圖片區域即可切換 e0.gif 與 0.gif');
            console.log('🔧 浮動導航位置已校準');

        });
    </script>
</body>
