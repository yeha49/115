<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>室內配線乙級</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        
        .header {
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #f0f6fc;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }
        
        .header p {
            font-size: 1.1rem;
            color: #8b949e;
        }
        
        .station-section {
            margin-bottom: 50px;
            width: 100%;
        }
        
        .station-title {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            text-align: center;
            background-color: #363636;
        }
        
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .link-card {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #c9d1d9;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .link-card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 15px rgba(88, 166, 255, 0.4);
        }
        
        .link-icon {
            font-size: 2rem;
            margin-right: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
        }
        
        .link-content {
            text-align: left;
            flex: 1;
        }
        
        .link-content h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #f0f6fc;
        }
        
        .link-content p {
            color: #8b949e;
            font-size: 0.9rem;
        }
        
        .footer {
            margin-top: 30px;
            color: #8b949e;
            font-size: 0.9rem;
        }
        
        /* 邮件联系表单样式 */
        .form-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-container.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .contact-form {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .form-header h2 {
            color: #58a6ff;
            font-size: 1.8rem;
        }
        
        .close-btn {
            background: #30363d;
            color: #8b949e;
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #484f58;
            color: #f0f6fc;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f0f6fc;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #30363d;
            border-radius: 8px;
            font-size: 1rem;
            background: #0d1117;
            color: #f0f6fc;
            transition: border 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
        }
        
        .btn {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn:hover {
            background: #2ea043;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(35, 134, 54, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #30363d;
            color: #8b949e;
        }
        
        .btn-outline:hover {
            background: #30363d;
            color: #f0f6fc;
        }
        
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .success {
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid rgba(35, 134, 54, 0.5);
        }
        
        .error {
            background: rgba(218, 54, 51, 0.2);
            color: #f85149;
            border: 1px solid rgba(218, 54, 51, 0.5);
        }
        
        .email-link {
            color: #58a6ff;
            text-decoration: none;
            transition: color 0.3s ease;
						cursor: pointer;
        }
        
        .email-link:hover {
            color: #79c0ff;
            /*text-decoration: underline;*/
        }
        
        @media (max-width: 900px) {
            .links-container {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .link-card {
                flex-direction: column;
                text-align: center;
            }
            
            .link-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .link-content {
                text-align: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
				
				.contact-form h5 {
						text-align: left;
						margin-top: 10px;
						width: 100%;
						color: #8b949e;
						font-size: 0.9rem;
						font-weight: normal;
						padding: 5px 0;
				}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size:48px; font-weight:bold;">油壓乙級</div>
            <div style="font-size:28px">(07900)</div>
        </div>
        
        
        <!-- 第二站 -->
        <div class="station-section">
            <div class="links-container">
                
                
                <a href="2.html?q=2-5" class="link-card">
                    <div class="link-icon">
                        <i class="fas fa-calculator"></i>
                    </div>
                    <div class="link-content">
                        <h2>第五題</h2>
                        <p>差動、調壓、調速迴路設計、裝配、運轉及調整</p>
                    </div>
                </a>
                
                <a href="2.html?q=2-6" class="link-card">
                    <div class="link-icon">
                        <i class="fas fa-chart-bar"></i>
                    </div>
                    <div class="link-content">
                        <h2>第六題</h2>
                        <p>蓄壓、鎖固、降壓迴路設計、裝配運轉及調整</p>
                    </div>
                </a>
                
                
            </div>
        </div>
        
        <div class="footer">
           
        </div>
    </div>
    

</body>
</html>
